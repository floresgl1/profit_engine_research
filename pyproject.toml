[project]
name = "profit-engine"
version = "0.1.0"
description = "Phase 1 research infrastructure for prediction markets: data ingestion, paper trading, scoring. Read-only; never places orders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests", "research"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
profit-engine = "profit_engine.cli:main"
