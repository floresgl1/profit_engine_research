[project]
name = "profit-engine"
version = "0.1.0"
description = "Phase 1 research infrastructure for prediction markets: data ingestion, paper trading, scoring. Read-only; never places orders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
